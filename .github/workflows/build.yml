name: Build RpKeyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/RpKeyboard
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RpKeyboard-v7-APK
          path: extracted/RpKeyboard/app/build/outputs/apk/debug/*.apk
